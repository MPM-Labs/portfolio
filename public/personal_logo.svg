<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -4 244 98" width="244" height="98">
  <title>&gt;&gt;= — pure value bound through effects into context</title>
  <!-- pure input -->
  <circle cx="20" cy="45" r="8.5" fill="#A7B0FF"/>
  <!-- bind operator >>= -->
  <g fill="none" stroke="#6E7BF7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 25 L80 45 L48 65"/>
    <path d="M88 25 L120 45 L88 65"/>
    <path d="M140 37 H170 M140 53 H170"/>
  </g>
  <!-- side effects (sparks) -->
  <g stroke="#F2541B" stroke-width="3.5" stroke-linecap="round">
    <line x1="99.30" y1="16.53" x2="92.24" y2="6.82"/>
    <line x1="104.00" y1="15.00" x2="104.00" y2="1.00"/>
    <line x1="108.70" y1="16.53" x2="115.76" y2="6.82"/>
  </g>
  <!-- embellished output: the value, wrapped in context -->
  <circle cx="211" cy="45" r="20.5" fill="none" stroke="#14B39A" stroke-width="3"/>
  <circle cx="211" cy="45" r="14.5" fill="none" stroke="#8FDCCD" stroke-width="2"/>
  <circle cx="211" cy="45" r="8.5" fill="#14B39A"/>
</svg>
